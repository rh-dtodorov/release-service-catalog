---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bts-sign
  annotations:
    tekton.dev/tags: signing, rpm
spec:
  description: |-
    Submits an InternalRequest for snapshot-based BTS, waits for completion, and returns the
    worker's sourceDataArtifact result. Reads signOptions.allowedComponents and Release attribution.
    The current worker returns the input Trusted Artifact unchanged without signing RPMs.
    Signing keys are not required for the passthrough worker.
  params:
    - name: snapshotPath
      type: string
      description: Relative path to the reduced snapshot spec in the input Trusted Artifact
    - name: dataPath
      type: string
      description: Relative path to the merged release data in the input Trusted Artifact
    - name: releasePath
      type: string
      description: Relative path to the collected Release JSON used for attribution
    - name: sourceDataArtifact
      type: string
      description: Input Trusted Artifact reference passed to the BTS worker
    - name: pipelineRunUid
      type: string
      description: Release PipelineRun UID for the InternalRequest correlation label
    - name: requestTimeout
      type: string
      description: Seconds to wait for the InternalRequest, including pipeline startup
      default: "2100"
    - name: pipelineTimeout
      type: string
      description: Pipeline timeout for the BTS InternalRequest
      default: "0h30m0s"
    - name: taskTimeout
      type: string
      description: Task timeout for the BTS InternalRequest
      default: "0h25m0s"
    - name: dataDir
      type: string
      description: Directory into which the input Trusted Artifact is extracted
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: Catalog repository URL for resolving the Trusted Artifact StepAction
    - name: taskGitRevision
      type: string
      description: Catalog revision for resolving the Trusted Artifact StepAction
    - name: signingRepo
      type: string
      description: Repository containing the internal BTS pipeline and worker task
      default: https://gitlab.cee.redhat.com/dtodorov/signing.git
    - name: signingRevision
      type: string
      description: Revision of the internal BTS pipeline and worker task
      default: rok-bts-iterdev
    - name: trustedArtifactsDebug
      type: string
      description: Non-empty value enables Trusted Artifact debug logging
      default: ""
    - name: orasOptions
      type: string
      description: Additional options for extracting the input Trusted Artifact
      default: ""
    - name: caTrustConfigMapName
      type: string
      description: ConfigMap containing the trusted CA bundle
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: CA bundle entry in the trusted CA ConfigMap
      default: ca-bundle.crt
  results:
    - name: sourceDataArtifact
      type: string
      description: Trusted Artifact returned by the completed BTS InternalRequest
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    securityContext:
      runAsUser: 1001
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: DEBUG
        value: $(params.trustedArtifactsDebug)
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
        - name: orasOptions
          value: $(params.orasOptions)
    - name: request-bts-sign
      image: quay.io/konflux-ci/release-service-utils@sha256:da48275d90ecd65e2aec9c71f74b86314ce6ceb81dc3045d5c7546c9548273e8
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 100m
      env:
        - name: DATA_FILE
          value: $(params.dataDir)/$(params.dataPath)
        - name: SNAPSHOT_FILE
          value: $(params.dataDir)/$(params.snapshotPath)
        - name: RELEASE_FILE
          value: $(params.dataDir)/$(params.releasePath)
        - name: SNAPSHOT_PATH
          value: $(params.snapshotPath)
        - name: DATA_PATH
          value: $(params.dataPath)
        - name: SOURCE_DATA_ARTIFACT
          value: $(params.sourceDataArtifact)
        - name: RESULT_FILE
          value: $(results.sourceDataArtifact.path)
        - name: SIGNING_REPO
          value: $(params.signingRepo)
        - name: SIGNING_REVISION
          value: $(params.signingRevision)
        - name: PIPELINERUN_UID
          value: $(params.pipelineRunUid)
        - name: TASKRUN_UID
          value: $(context.taskRun.uid)
        - name: REQUEST_NAMESPACE
          value: $(context.taskRun.namespace)
        - name: REQUEST_TIMEOUT
          value: $(params.requestTimeout)
        - name: PIPELINE_TIMEOUT
          value: $(params.pipelineTimeout)
        - name: TASK_TIMEOUT
          value: $(params.taskTimeout)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        : "${SOURCE_DATA_ARTIFACT:?No input Trusted Artifact reference was provided}"
        ALLOWED_COMPONENTS=$(jq -ce '
          (if .signOptions.allowedComponents == null then [] else .signOptions.allowedComponents end) |
          if type == "array" and all(.[]; type == "string" and length > 0)
          then . else error("signOptions.allowedComponents must be an array of component names") end
        ' "${DATA_FILE}")
        SELECTED_COMPONENTS=$(jq -ce --argjson allowed "${ALLOWED_COMPONENTS}" '
          .components |
          if type == "array" and all(.[]; (.name | type == "string" and length > 0))
          then [.[].name | select(. as $name | $allowed | index($name))]
          else error("snapshot components must have non-empty names") end
        ' "${SNAPSHOT_FILE}")
        REQUESTER="NOT_ENOUGH_DATA"
        if [[ -f "${RELEASE_FILE}" ]]; then
          REQUESTER=$(jq -r '
            .status.attribution.author |
            if type == "string" and length > 0 then . else "NOT_ENOUGH_DATA" end
          ' "${RELEASE_FILE}")
        fi

        SERVICE_ACCOUNT=$(jq -er '
          .signOptions.signPipelineServiceAccount // "release-service-account" |
          if type == "string" and length > 0 then .
          else error("signOptions.signPipelineServiceAccount must be a non-empty string") end
        ' "${DATA_FILE}")

        printf 'Allowed components: %s\nSelected snapshot components: %s\n' \
          "${ALLOWED_COMPONENTS}" "${SELECTED_COMPONENTS}"
        # NOTE: explicit allowlist until hub-policy gating is integrated (or some other gating).
        # NOTE: reuse the existing CLI; move orchestration to release-service-utils with real signing.
        # TODO: validate signing configuration when the worker implements real signing.
        # TODO: preserve Koji metadata when publishing signed RPMs and a new snapshot spec.
        # TODO: add Snapshot CR support and genuine BTS Conforma evidence after real signing exists.
        internal-request --pipeline bts-sign \
          -p "source_data_artifact=${SOURCE_DATA_ARTIFACT}" \
          -p "snapshot_path=${SNAPSHOT_PATH}" \
          -p "data_path=${DATA_PATH}" \
          -p "allowed_components=${ALLOWED_COMPONENTS}" \
          -p "requester=${REQUESTER}" \
          -p "taskGitUrl=${SIGNING_REPO}" \
          -p "taskGitRevision=${SIGNING_REVISION}" \
          -l "internal-services.appstudio.openshift.io/pipelinerun-uid=${PIPELINERUN_UID}" \
          -l "internal-services.appstudio.openshift.io/taskrun-uid=${TASKRUN_UID}" \
          -t "${REQUEST_TIMEOUT}" \
          --service-account "${SERVICE_ACCOUNT}" \
          --pipeline-timeout "${PIPELINE_TIMEOUT}" \
          --task-timeout "${TASK_TIMEOUT}" \
          -s true

        REQUEST=$(kubectl get internalrequest -n "${REQUEST_NAMESPACE}" \
          -l "internal-services.appstudio.openshift.io/taskrun-uid=${TASKRUN_UID}" -o json | jq -ce '
            .items | if length == 1 then .[0]
            else error("Expected exactly one BTS InternalRequest for this TaskRun") end
          ')
        OUTPUT_ARTIFACT=$(jq -er '
          if any(.status.conditions[]?; .type == "InternalRequestSucceeded" and .status == "True")
          then .status.results.sourceDataArtifact
          else error("BTS InternalRequest did not succeed") end |
          if type == "string" and length > 0 then .
          else error("BTS InternalRequest did not return sourceDataArtifact") end
        ' <<< "${REQUEST}")
        printf 'BTS InternalRequest: %s\nBTS PipelineRun: %s\nReturned artifact: %s\n' \
          "$(jq -r '.metadata.name' <<< "${REQUEST}")" \
          "$(jq -r '.status.pipelineRun' <<< "${REQUEST}")" "${OUTPUT_ARTIFACT}"
        printf '%s' "${OUTPUT_ARTIFACT}" > "${RESULT_FILE}"
